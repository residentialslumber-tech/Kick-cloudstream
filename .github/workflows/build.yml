name: Build

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '*.md'
  workflow_dispatch:

concurrency:
  group: "build"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: "src"

      - name: Checkout builds branch
        uses: actions/checkout@v4
        with:
          ref: "builds"
          path: "builds"
        continue-on-error: true

      - name: Create builds branch if missing
        run: |
          if [ ! -d builds/.git ]; then
            rm -rf builds
            mkdir builds
            cd builds
            git init
            git checkout -b builds
            git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          fi

      - name: Clean old builds
        run: rm -f $GITHUB_WORKSPACE/builds/*.cs3 $GITHUB_WORKSPACE/builds/plugins.json

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: adopt
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Build plugins
        run: |
          cd $GITHUB_WORKSPACE/src
          set -o pipefail
          gradle make makePluginsJson --console=plain 2>&1 | tee $GITHUB_WORKSPACE/gradle.log || {
            echo ""
            echo "=============== COMPILER ERRORS ==============="
            grep -E '^e: ' $GITHUB_WORKSPACE/gradle.log || echo "(no 'e:' lines found)"
            echo "==============================================="
            exit 1
          }
          cp **/build/*.cs3 $GITHUB_WORKSPACE/builds
          cp build/plugins.json $GITHUB_WORKSPACE/builds

      - name: Push builds
        run: |
          cd $GITHUB_WORKSPACE/builds
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add .
          if git rev-parse --verify HEAD >/dev/null 2>&1; then
            git commit --amend -m "Build $GITHUB_SHA"
          else
            git commit -m "Build $GITHUB_SHA"
          fi
          git push --force origin HEAD:builds
